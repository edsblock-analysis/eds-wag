eading + copy) telling one customer's shopping story; scroll-driven sequential reveal.","states":["static/scroll-reveal"]},"card-carousel":{"observed":"Carousel of content cards (heading + 'Contact us to get started' CTA to /home/contact.html) with pagination dots ('slide N of 3'); auto-advances.","states":["auto-rotating","dot-selected"]},"icon-carousel":{"observed":"Process/steps carousel (Identify goals → Understand your customers → Plan your campaign) with step icons and a 'Let's go' CTA; prev/next style navigation.","states":["step-1","advance"]},"feature-text":{"observed":"Large statement text ('The Walgreens customer is everyone...') with a scroll-triggered 'reveal' animation variation and a 'Read their stories' CTA.","states":["pre-reveal","revealed"]},"results-cards":{"observed":"Grid of result/case-study cards (title + KPI like 'Over 6x ROAS') with a 'Load more' control to reveal additional cards; each links to a case study.","states":["initial","load-more-expanded"]},"results-hero":{"observed":"Hero with H1 'Proven effectiveness' and prominent KPI stats ($5 avg ROAS, 3.4% ...) with footnotes.","states":["static"]},"solutions-detail-hero":{"observed":"Large solution-detail hero (H1 + multiple offering sub-sections with many links/CTAs). Offerings presented with anchored navigation into offsite/onsite solutions.","states":["static","anchor-nav"]},"testimonial":{"observed":"Quote block with attribution (name/role); multiple testimonials present (careers page shows several employee quotes).","states":["static-or-rotating"]}},"urlList":[{"url":"https://www.walgreensadvertisinggroup.com/","t":"home-landing","m":0,"lang":"en"},{"url":"https://www.walgreensadvertisinggroup.com/home/about.html","t":"page-about","m":0,"lang":"en"},{"url":"https://www.walgreensadvertisinggroup.com/home/approach.html","t":"page-approach","m":0,"lang":"en"},{"url":"https://www.walgreensadvertisinggroup.com/home/careers.html","t":"page-careers","m":0,"lang":"en"},{"url":"https://www.wa
